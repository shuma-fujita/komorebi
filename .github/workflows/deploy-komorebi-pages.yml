name: Deploy Komorebi Pages (OAuth config from Secret)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: komorebi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # UI fragments are shared; deploy only checked-in pages, never rebuild game code here.
      - name: Verify mock-first UI sources and both checked-in pages
        run: |
          node --check komorebi3d/build-ui.mjs
          node --check komorebi3d/mock-ui.js
          node --check komorebi3d/maps/editor-keyboard-layout.js
          node --check komorebi3d/maps/editor-keyboard-diagnostics.js
          node --check komorebi3d/maps/sheet-motion.js
          node --check komorebi3d/maps/sheet-scroll-guard.js
          node --check komorebi3d/maps/osm-element-page-url.js
          node --check komorebi3d/maps/osm-changeset-tags.js
          node --check komorebi3d/maps/osm-test-api.js
          node --check komorebi3d/maps/osm-pending-changes.js
          node --check komorebi3d/maps/osm-review-storage-check.js
          node --check komorebi3d/maps/map-loader.js
          node --check komorebi3d/maps/map-filename-indicator.js
          node --check komorebi3d/maps/map-labels.js
          node --check komorebi3d/maps/osm-pending-tag-visual.js
          node --check komorebi3d/local-storage-panel.js
          node --check komorebi3d/objects/parking/const.js
          node --check komorebi3d/objects/parking/osm-adapter.js
          node --check komorebi3d/objects/parking/common.js
          node --check komorebi3d/dev-panel-layout.js
          node tests/map-filename-indicator.mjs
          node tests/parking-areas.mjs
          node tests/osm-element-page-url.mjs
          node tests/osm-changeset-tags.mjs
          node tests/osm-tag-changes-v2.mjs
          node tests/local-storage-panel-structure.mjs
          node tests/editor-keyboard-layout.mjs
          node tests/sheet-gesture-ownership.mjs
          node tests/editor-preview-camera-window.mjs
          node komorebi3d/build-ui.mjs --check
      - name: Prepare Pages artifact without writing Client ID to git
        env:
          OSM_TEST_CLIENT_ID: ${{ secrets.OSM_TEST_CLIENT_ID }}
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          node scripts/write-osm-test-oauth-config.mjs _site/komorebi3d/maps/osm-test-client-config.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
