name: Deploy Komorebi Pages (OAuth config from Secret)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: komorebi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # UI fragments are shared; deploy only checked-in pages, never rebuild game code here.
      - name: Verify mock-first UI sources and both checked-in pages
        run: |
          find komorebi3d -type f \( -name '*.js' -o -name '*.mjs' \) ! -path '*/tests/*' -print0 | xargs -0 -r -n 1 node --check
          node tests/matsudo-camera-depth.mjs
          node tests/parking-areas.mjs
          node tests/brand-png-assets.mjs
          node tests/facade-rendering.mjs
          node tests/entrance-wall-selection.mjs
          node tests/storefronts.mjs
          node tests/osm-environment-isolation.mjs
          node tests/osm-module-startup.mjs
          node tests/osm-element-page-url.mjs
          node tests/osm-changeset-tags.mjs
          node tests/osm-tag-changes-v2.mjs
          node tests/storage-safety.mjs
          node tests/map-dynamic-priority.mjs
          node tests/map-focus.mjs
          node tests/map-occupants.mjs
          node tests/tenant-level-inference.mjs
          node tests/tenant-outside-warning.mjs
          node tests/building-editor-fit.mjs
          node komorebi3d/build-ui.mjs --check
      - name: Prepare Pages artifact without writing Client ID to git
        env:
          OSM_TEST_CLIENT_ID: ${{ secrets.OSM_TEST_CLIENT_ID }}
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          node scripts/write-osm-test-oauth-config.mjs _site/komorebi3d/maps/osm-test-client-config.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
