name: Diagnose GitHub schedule trigger (temporary 2026-11-22)

# Temporary schedule-only probe. No source downloads, artifacts or repository writes.
# Nov 22 only: every 15min from 13:07 to 15:52 JST (04:07-06:52 UTC).
# Remove this workflow after interpreting the scheduled run records.
on:
  schedule:
    - cron: '7,22,37,52 4-6 22 11 *'

permissions:
  contents: read

jobs:
  record-schedule:
    name: Record received schedule event
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print trigger and timestamp (no PBF download)
        shell: bash
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "scheduled_cron=${TRIGGER_CRON}"
          echo "commit_sha=${GITHUB_SHA}"
          echo "executed_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "executed_at_jst=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          test "${GITHUB_EVENT_NAME}" = schedule
