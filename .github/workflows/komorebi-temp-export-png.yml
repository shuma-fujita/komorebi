name: Temporary brand PNG export

on:
  push:
    paths:
      - '.github/workflows/komorebi-temp-export-png.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Export current brand WebP assets to lossless PNG bytes
        run: |
          python - <<'PY'
          import base64, io, pathlib, collections
          from PIL import Image
          names=['lawson','rakuten-mobile','yoshinoya','hidakaya','tonkatsu-tonichi','isomaru','hoshino']
          for name in names:
              p=pathlib.Path('komorebi3d/assets/textures/brands')/(name+'.webp')
              im=Image.open(p).convert('RGBA')
              def pixel(x,y):
                  return im.getpixel((min(im.width-1,x),min(im.height-1,y)))
              samples=[pixel(0,0),pixel(im.width//2,0),pixel(0,im.height//2),
                       pixel(im.width//2,im.height//2),pixel(im.width-1,im.height-1)]
              print('PNG_METADATA:'+name+':'+str(im.size)+':'+repr(samples),flush=True)
              if name=='rakuten-mobile':
                  common=collections.Counter(im.getdata()).most_common(12)
                  print('PNG_COLORS:'+name+':'+repr(common),flush=True)
              out=io.BytesIO()
              im.save(out,format='PNG',optimize=True)
              print('PNG_EXPORT:'+name+':'+base64.b64encode(out.getvalue()).decode('ascii'),flush=True)
          PY
