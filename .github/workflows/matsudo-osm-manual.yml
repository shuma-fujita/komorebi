name: Update Matsudo OSM JSON (manual only)

# No push, pull_request, or schedule triggers. Run workflow is the only trigger.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matsudo-osm-manual-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest Matsudo 500m OSM through approved Overpass servers
        run: python komorebi3d/maps/fetch-map.py

      - name: Validate new JSON before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('komorebi3d/maps/data/matsudo.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data.get('source') == 'OpenStreetMap contributors'
          assert data.get('center') == [35.78444,139.90061]
          assert data.get('bbox') == '35.782194,139.897842,35.786686,139.903378'
          features=data.get('elements')
          assert isinstance(features,list)
          buildings=sum(e.get('type')=='way' and bool(e.get('tags',{}).get('building')) and len(e.get('geometry',[]))>=4 for e in features)
          roads=sum(e.get('type')=='way' and bool(e.get('tags',{}).get('highway')) and len(e.get('geometry',[]))>=2 for e in features)
          facility_keys=('shop','amenity','tourism','office','leisure','healthcare')
          facilities=sum(any(e.get('tags',{}).get(k) for k in facility_keys) for e in features)
          assert buildings>=10 and roads>=10 and facilities>=1,(buildings,roads,facilities)
          print(f'Validated Matsudo 500m: {len(features)} elements, {buildings} buildings, {roads} roads, {facilities} facilities')
          PY

      - name: Commit only matsudo.json if changed
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          trap 'rm -f "$snapshot"' EXIT
          cp komorebi3d/maps/data/matsudo.json "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" komorebi3d/maps/data/matsudo.json
            git add -- komorebi3d/maps/data/matsudo.json
            if git diff --cached --quiet; then
              echo "Matsudo JSON is already up to date. No commit."
              exit 0
            fi
            git commit -m "matsudo: manually refresh verified 500m OSM JSON"
            if git push origin HEAD:main; then
              echo "Updated Matsudo JSON on main."
              exit 0
            fi
            echo "main moved, retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to publish Matsudo JSON after 5 attempts" >&2
          exit 1
